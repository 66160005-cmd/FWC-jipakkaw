<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <header>
      <h1>User Profile Card</h1>
    </header>

    <div class="card">
      <img
        class="profile-picture"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2i18O27TWaQBvcZvb25d6JXTMxtzKK8yxip0AFQhl2C9D_cc7CFzJ2Xw&s=10"
        alt="Profile picture"
      />

      <table class="info-table">
        <tr>
          <td class="login">jipakkaw</td>
        </tr>
        <tr>
          <td class="description">Curious, focused, Uma</td>
        </tr>
        <tr>
          <td class="socials">
            <a href="#"><img src="https://img.magnific.com/free-vector/new-2023-twitter-logo-x-icon-design_1017-45418.jpg?semt=ais_hybrid&w=740&q=80" alt="Twitter" /></a>
            <a href="#"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Facebook" /></a>
            <a href="#"><img src="https://images.icon-icons.com/1488/PNG/512/5295-youtube-i_102568.png" alt="Youtube" /></a>
          </td>
        </tr>
      </table>

      <a class="contact-btn" href="https://youtu.be/dQw4w9WgXcQ?si=ZdpXY4Vm5Mb55cmW" target="_blank">Contact</a>
    </div>
  </body>
</html>
